<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gather & Thrive — our new website is coming soon.">
  <title>Gather &amp; Thrive</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; background: #f6f4ed; color: #243e33; font-family: system-ui, sans-serif; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 760px); text-align: center; padding: clamp(32px, 8vw, 80px) 16px; }
    .eyebrow { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
    h1 { font-family: Georgia, serif; font-weight: 400; font-size: clamp(48px, 10vw, 92px); line-height: 1.08; letter-spacing: -.045em; margin: 32px 0; }
    .rule { width: 48px; height: 2px; background: #647b58; margin: 32px auto; }
    p { line-height: 1.7; font-size: 18px; margin: 0; }
    .detail { font-size: 15px; color: #526459; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Welcome to</p>
    <h1>Gather &amp; Thrive</h1>
    <div class="rule" aria-hidden="true"></div>
    <p>Our new website is coming soon.</p>
    <p class="detail">We look forward to sharing more with you.</p>
  </main>
</body>
</html>
